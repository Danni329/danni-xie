<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>谢丹妮｜作品集</title>

  <style>
    body{
      margin:0;
      padding:0;
      font-family: "PingFang SC","Microsoft YaHei",sans-serif;
      background:#f5f5f5;
      color:#222;
    }

    .container{
      max-width:900px;
      margin:80px auto;
      background:white;
      border-radius:20px;
      padding:60px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
      text-align:center;
    }

    h1{
      font-size:42px;
      margin-bottom:10px;
    }

    .subtitle{
      font-size:18px;
      color:#666;
      margin-bottom:40px;
    }

    .description{
      line-height:1.9;
      font-size:17px;
      color:#444;
      margin-bottom:50px;
    }

    .button{
      display:inline-block;
      padding:16px 36px;
      background:#222;
      color:white;
      text-decoration:none;
      border-radius:999px;
      font-size:18px;
      transition:0.3s;
    }

    .button:hover{
      background:#555;
    }

    .footer{
      margin-top:50px;
      color:#999;
      font-size:14px;
    }

<body>

  <div class="container">

    <h1>谢丹妮</h1>

    <div class="description">
      本作品集包含数字媒体、AIGC互动叙事、网页设计、视觉设计与文化遗产传播相关项目，
